# Decap CMS config. Replace https://jir-decap-auth.jashidulislamhridoy.workers.dev with your Cloudflare Worker URL after setup.
backend:
  name: github
  repo: jashidulislamhridoy-cyber/jir-digital
  branch: main
  base_url: BACKEND_URL
  auth_endpoint: auth
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
collections:
  - name: "site"
    label: "Site content"
    files:
      - name: "homepage"
        label: "Homepage text"
        file: "data/homepage.json"
        fields:
          - { label: "Hero headline", name: "hero_title", widget: "string" }
          - { label: "Hero subtitle", name: "hero_subtitle", widget: "text" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
