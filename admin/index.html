<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIR Digital | Content Admin</title>
</head>
<body>
<script>
  window.CMS_MANUAL_INIT = true;
</script>
<script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
<script>
  CMS.init({
    config: {
      backend: {
        name: "github",
        repo: "jashidulislamhridoy-cyber/jir-digital",
        branch: "main",
        base_url: "https://jir-decap-auth.jashidulislamhridoy.workers.dev",
        auth_endpoint: "auth"
      },
      media_folder: "assets/uploads",
      public_folder: "/assets/uploads",
      collections: [
        {
          name: "site",
          label: "Site content",
          files: [
            {
              name: "homepage",
              label: "Homepage text",
              file: "data/homepage.json",
              fields: [
                { label: "Hero subtitle", name: "hero_subtitle", widget: "text" },
                { label: "Email", name: "email", widget: "string" }
              ]
            }
          ]
        }
      ]
    }
  });
</script>
</body>
</html>
