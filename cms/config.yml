backend:
  name: github
  repo: jashidulislamhridoy-cyber/jir-digital
  branch: main
  base_url: https://jir-decap-auth.jashidulislamhridoy.workers.dev
  auth_endpoint: auth
media_folder: assets/uploads
public_folder: /assets/uploads
collections:
  - name: site
    label: Site content
    files:
      - name: homepage
        label: Homepage
        file: data/homepage.json
        fields:
          - label: Logo
            name: logo
            widget: image
            required: false
          - label: Hero subtitle
            name: hero_subtitle
            widget: text
          - label: Email
            name: email
            widget: string
          - label: Google Analytics 4 ID
            name: ga4_id
            widget: string
            required: false
            hint: "Example: G-XXXXXXXXXX. Leave empty to disable."
          - label: Meta Pixel ID
            name: meta_pixel_id
            widget: string
            required: false
            hint: "Facebook Pixel numeric ID. Leave empty to disable."
